<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="980" fill="#ffffff"/>

  <!-- ── header ────────────────────────────────────────────────── -->
  <text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a" letter-spacing="-0.4">TCR–pMHC binding: a five-stream ensemble over STAG</text>
  <text x="48" y="86" font-size="15" fill="#475569">8 peptide datasets · 9,343 complexes · 5-fold CV · 3 seeds · 44 members per dataset</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#0f172a" stroke-width="2"/>

  <!-- ── column labels ─────────────────────────────────────────── -->
  <text x="48"  y="134" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.6">SOURCE</text>
  <text x="330" y="134" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.6">FIVE STREAMS — WHAT EACH ONE ACTUALLY READS</text>
  <text x="800" y="134" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.6">FUSION</text>
  <text x="1020" y="134" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.6">OUT</text>

  <!-- ── source ────────────────────────────────────────────────── -->
  <rect x="48" y="150" width="230" height="156" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="180" font-size="16" font-weight="700" fill="#0f172a">STAG_public</text>
  <text x="68" y="204" font-size="13" fill="#475569">modelled TCR–pMHC</text>
  <text x="68" y="222" font-size="13" fill="#475569">complexes + contact maps</text>
  <text x="68" y="252" font-size="22" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">9,343</text>
  <text x="68" y="272" font-size="12" fill="#64748b">rows · 8 peptides</text>
  <text x="68" y="294" font-size="12" fill="#64748b">one 10x dextramer experiment</text>

  <!-- audit box -->
  <rect x="48" y="340" width="230" height="188" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="68" y="368" font-size="14" font-weight="700" fill="#92400e">Provenance audit</text>
  <text x="68" y="392" font-size="12.5" fill="#78350f">Excluding a source by NAME</text>
  <text x="68" y="410" font-size="12.5" fill="#78350f">is not provenance. One curated</text>
  <text x="68" y="428" font-size="12.5" fill="#78350f">study was 88% exact duplicates</text>
  <text x="68" y="446" font-size="12.5" fill="#78350f">of the target — worth a fake</text>
  <text x="68" y="464" font-size="12.5" font-weight="700" fill="#92400e">+0.3 AUC.</text>
  <text x="68" y="492" font-size="12.5" fill="#78350f">Exact-record match drops</text>
  <text x="68" y="510" font-size="12.5" font-weight="700" fill="#92400e">18 of 131 studies.</text>

  <!-- ── streams ───────────────────────────────────────────────── -->
  <!-- 1 structure -->
  <rect x="330" y="150" width="420" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="330" y="150" width="4" height="74" fill="#94a3b8"/>
  <text x="350" y="176" font-size="15" font-weight="700" fill="#0f172a">1 · Structure</text>
  <text x="350" y="197" font-size="12.5" fill="#475569">STAG (GNN) · Contacts · CNN_3D — the upstream models</text>
  <text x="350" y="215" font-size="12" fill="#94a3b8">9 members · best single 0.690–0.917</text>

  <!-- 2 sequence (the one that paid) -->
  <rect x="330" y="238" width="420" height="74" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="330" y="238" width="4" height="74" fill="#0f766e"/>
  <text x="350" y="264" font-size="15" font-weight="700" fill="#134e4a">2 · TCR sequence　★ where the gain came from</text>
  <text x="350" y="285" font-size="12.5" fill="#115e59">SeqLR · SeqGBM · SeqMLP · SeqKNN — char n-grams on the CDR3</text>
  <text x="350" y="303" font-size="12" fill="#5eada4">read back out of the structure files · 12 members</text>

  <!-- 3 contacts -->
  <rect x="330" y="326" width="420" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="330" y="326" width="4" height="74" fill="#94a3b8"/>
  <text x="350" y="352" font-size="15" font-weight="700" fill="#0f172a">3 · Contact statistics</text>
  <text x="350" y="373" font-size="12.5" fill="#475569">ConGBM · ConLR — residue-contact summaries, no graph</text>
  <text x="350" y="391" font-size="12" fill="#94a3b8">6 members</text>

  <!-- 4 data -->
  <rect x="330" y="414" width="420" height="92" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="330" y="414" width="4" height="92" fill="#94a3b8"/>
  <text x="350" y="440" font-size="15" font-weight="700" fill="#0f172a">4 · A second label source</text>
  <text x="350" y="461" font-size="12.5" fill="#475569">SeqExt · SeqExtOnly · SeqClean · SeqNN2 · SeqDedup · SeqPU · SeqAvg3</text>
  <text x="350" y="479" font-size="12.5" fill="#475569">curated published TCRs (VDJdb · McPAS · IEDB) + denoisers</text>
  <text x="350" y="497" font-size="12" fill="#94a3b8">15 members · everything above re-reads the SAME experiment</text>

  <!-- 5 plm -->
  <rect x="330" y="520" width="420" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="330" y="520" width="4" height="74" fill="#94a3b8"/>
  <text x="350" y="546" font-size="15" font-weight="700" fill="#0f172a">5 · Protein language model</text>
  <text x="350" y="567" font-size="12.5" fill="#475569">SeqESM · SeqESMNN — ESM-2 embeddings (35M)</text>
  <text x="350" y="585" font-size="12" fill="#94a3b8">2 members · on par with char n-grams, better on 2/8</text>

  <!-- arrows source -> streams -->
  <path d="M278,228 C305,228 305,187 326,187" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M278,228 C305,228 305,275 326,275" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M278,228 C305,228 305,363 326,363" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M278,228 C305,228 305,557 326,557" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M278,434 C300,434 300,460 326,460" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#aw)"/>

  <!-- ── fusion ────────────────────────────────────────────────── -->
  <rect x="800" y="150" width="180" height="444" rx="3" fill="#0f172a"/>
  <text x="820" y="182" font-size="16" font-weight="700" fill="#ffffff">Fusion</text>
  <text x="820" y="208" font-size="12.5" fill="#cbd5e1">rank-normalise</text>
  <text x="820" y="226" font-size="12.5" fill="#cbd5e1">every member</text>

  <line x1="820" y1="246" x2="960" y2="246" stroke="#334155"/>
  <text x="820" y="272" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.2">7 POOLS</text>
  <text x="820" y="292" font-size="12" fill="#e2e8f0">struct · seq · con</text>
  <text x="820" y="310" font-size="12" fill="#e2e8f0">data · esm</text>
  <text x="820" y="328" font-size="12" fill="#e2e8f0">structseq · all</text>

  <text x="820" y="362" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.2">4 RULES</text>
  <text x="820" y="382" font-size="12" fill="#e2e8f0">soft · d′</text>
  <text x="820" y="400" font-size="12" fill="#e2e8f0">maxconf · stacking</text>

  <line x1="820" y1="422" x2="960" y2="422" stroke="#334155"/>
  <text x="820" y="448" font-size="12.5" font-weight="700" fill="#5eead4">pool AND rule are</text>
  <text x="820" y="466" font-size="12.5" font-weight="700" fill="#5eead4">picked on the OTHER</text>
  <text x="820" y="484" font-size="12.5" font-weight="700" fill="#5eead4">folds, never on the</text>
  <text x="820" y="502" font-size="12.5" font-weight="700" fill="#5eead4">fold being scored</text>
  <text x="820" y="534" font-size="11.5" fill="#94a3b8">44 members / dataset</text>
  <text x="820" y="552" font-size="11.5" fill="#94a3b8">(41 for KLGGALQAK)</text>
  <text x="820" y="576" font-size="11.5" fill="#64748b">local/fuse_all.py</text>

  <path d="M754,300 C778,300 778,330 796,330" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ── out ───────────────────────────────────────────────────── -->
  <rect x="1012" y="150" width="140" height="120" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1030" y="178" font-size="13" font-weight="700" fill="#0f172a">report.html</text>
  <text x="1030" y="200" font-size="11.5" fill="#64748b">per-peptide AUC,</text>
  <text x="1030" y="216" font-size="11.5" fill="#64748b">every member,</text>
  <text x="1030" y="232" font-size="11.5" fill="#64748b">every rule</text>
  <text x="1030" y="256" font-size="11.5" fill="#94a3b8">build_report.py</text>
  <path d="M984,210 L1008,210" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ── results ─────────────────────────────────────────────── -->
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#0f172a" stroke-width="2"/>
  <text x="48" y="662" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.6">RESULT — FUSED AUC PER PEPTIDE, RULE SELECTED OFF-FOLD</text>
  <text x="1152" y="662" font-size="11.5" fill="#94a3b8" text-anchor="end">grey = labels could not be verified against any public TCR database</text>
  <line x1="420" y1="692" x2="420" y2="936" stroke="#cbd5e1"/>
  <line x1="715" y1="686" x2="715" y2="940" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="715" y="958" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">0.75 target</text>
  <text x="420" y="958" font-size="11" fill="#94a3b8" text-anchor="middle">0.50</text>
  <text x="1010" y="958" font-size="11" fill="#94a3b8" text-anchor="middle">1.00</text>
  <g font-size="13">
    <text x="408" y="705" text-anchor="end" fill="#334155">ELAGIGILTV</text>
    <rect x="420" y="693" width="514" height="16" fill="#0f766e"/>
    <text x="1030" y="706" font-size="13" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">0.936</text>
    <text x="1088" y="706" font-size="11" fill="#94a3b8">A*02</text>
    <text x="408" y="735" text-anchor="end" fill="#334155">GLCTLVAML</text>
    <rect x="420" y="723" width="404" height="16" fill="#0f766e"/>
    <text x="1030" y="736" font-size="13" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">0.842</text>
    <text x="1088" y="736" font-size="11" fill="#94a3b8">A*02</text>
    <text x="408" y="765" text-anchor="end" fill="#334155">RAKFKQLL</text>
    <rect x="420" y="753" width="385" height="16" fill="#0f766e"/>
    <text x="1030" y="766" font-size="13" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">0.826</text>
    <text x="1088" y="766" font-size="11" fill="#94a3b8">B*08</text>
    <text x="408" y="795" text-anchor="end" fill="#334155">GILGFVFTL</text>
    <rect x="420" y="783" width="379" height="16" fill="#0f766e"/>
    <text x="1030" y="796" font-size="13" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">0.821</text>
    <text x="1088" y="796" font-size="11" fill="#94a3b8">A*02</text>
    <text x="408" y="825" text-anchor="end" fill="#334155">IVTDFSVIK</text>
    <rect x="420" y="813" width="282" height="16" fill="#64748b"/>
    <text x="1030" y="826" font-size="13" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">0.739</text>
    <text x="1088" y="826" font-size="11" fill="#94a3b8">A*11</text>
    <text x="408" y="855" text-anchor="end" fill="#334155">NLVPMVATV</text>
    <rect x="420" y="843" width="230" height="16" fill="#64748b"/>
    <text x="1030" y="856" font-size="13" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">0.695</text>
    <text x="1088" y="856" font-size="11" fill="#94a3b8">A*02</text>
    <text x="408" y="885" text-anchor="end" fill="#b45309" font-weight="600">KLGGALQAK</text>
    <rect x="420" y="873" width="117" height="16" fill="#cbd5e1"/>
    <text x="1030" y="886" font-size="13" font-weight="700" fill="#64748b" font-family="ui-monospace, Menlo, monospace">0.599</text>
    <text x="1088" y="886" font-size="11" fill="#94a3b8">A*03</text>
    <text x="408" y="915" text-anchor="end" fill="#b45309" font-weight="600">AVFDRKSDAK</text>
    <rect x="420" y="903" width="104" height="16" fill="#cbd5e1"/>
    <text x="1030" y="916" font-size="13" font-weight="700" fill="#64748b" font-family="ui-monospace, Menlo, monospace">0.588</text>
    <text x="1088" y="916" font-size="11" fill="#94a3b8">A*11</text>
  </g>
  <text x="48" y="706" font-size="38" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">0.756</text>
  <text x="48" y="726" font-size="12" fill="#64748b">mean, all 8 datasets</text>
  <text x="48" y="772" font-size="27" font-weight="700" fill="#0f766e" font-family="ui-monospace, Menlo, monospace">0.833</text>
  <text x="48" y="792" font-size="12" fill="#64748b">mean, the 5 with verifiable labels</text>
  <rect x="48" y="812" width="246" height="132" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="64" y="836" font-size="12.5" font-weight="700" fill="#92400e">Read every AUC here — and</text>
  <text x="64" y="854" font-size="12.5" font-weight="700" fill="#92400e">in the paper — as carrying</text>
  <text x="64" y="872" font-size="12.5" font-weight="700" fill="#92400e">≈ +0.03 of test-fold selection.</text>
  <text x="64" y="896" font-size="11.5" fill="#78350f">The epoch is chosen on the</text>
  <text x="64" y="911" font-size="11.5" fill="#78350f">fold being scored. A stop-on-</text>
  <text x="64" y="926" font-size="11.5" fill="#78350f">validation control measured it:</text>
  <text x="64" y="941" font-size="11.5" fill="#78350f">+0.029 at k=5, +0.050 at k=10.</text>
</svg>
